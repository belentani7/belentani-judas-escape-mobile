<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#17110d">
<title>JUDAS / 01 / La caja de luz</title>
<style>
:root{--ink:#e5d7c2;--paper:#cdbb9e;--red:#8f1920;--brass:#b4874d;--wood:#332017;--shadow:rgba(0,0,0,.6);font-family:Georgia,"Times New Roman",serif;color:var(--ink);background:#17100c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow:hidden;background:#17100c}button{font:inherit;color:inherit}button:focus-visible{outline:2px solid #d9b777;outline-offset:3px}.game{position:relative;width:100%;height:100svh;overflow:hidden;background:#1a120e;isolation:isolate}.wall{position:absolute;inset:0 0 43%;background:linear-gradient(110deg,#261b16,#4a392c 46%,#211712 100%);z-index:-4}.wall:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 52px,rgba(255,255,255,.018) 53px 54px),linear-gradient(180deg,rgba(0,0,0,.2),transparent 35%,rgba(0,0,0,.42));opacity:.7}.horizon{position:absolute;left:0;right:0;top:42.5%;height:4px;background:rgba(17,10,7,.8);box-shadow:0 2px 0 rgba(214,175,113,.08),0 14px 25px rgba(0,0,0,.55);z-index:1}.desk{position:absolute;left:-22%;right:-22%;top:42%;bottom:-18%;transform:perspective(740px) rotateX(14deg);transform-origin:50% 0;background:linear-gradient(105deg,#1b100b 0%,#49291a 38%,#29160e 67%,#130c08 100%);box-shadow:inset 0 18px 20px rgba(0,0,0,.35),0 -20px 50px rgba(0,0,0,.48);z-index:0}.desk:before{content:"";position:absolute;inset:0;opacity:.34;background:repeating-linear-gradient(4deg,transparent 0 22px,rgba(206,142,76,.13) 23px 24px,transparent 25px 47px),repeating-linear-gradient(92deg,transparent 0 85px,rgba(15,7,4,.18) 86px 88px)}.desk:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 52% 18%,transparent 0 24%,rgba(0,0,0,.32) 70%);pointer-events:none}.ambient{position:absolute;left:15%;top:32%;width:72%;height:38%;border-radius:50%;background:rgba(202,145,68,.18);filter:blur(28px);z-index:1;mix-blend-mode:screen}.lamp{position:absolute;z-index:4;left:9%;top:6%;width:150px;height:240px;transform:rotate(-7deg);filter:drop-shadow(14px 20px 9px rgba(0,0,0,.48))}.lamp__stem{position:absolute;left:60px;top:0;width:8px;height:143px;background:linear-gradient(90deg,#201812,#a17642 48%,#16100b);border-radius:8px;transform:rotate(8deg);transform-origin:top}.lamp__shade{position:absolute;left:18px;top:110px;width:126px;height:84px;background:linear-gradient(165deg,#231a13,#715334 48%,#2d1e13);clip-path:polygon(17% 0,83% 0,100% 90%,0 90%);border-radius:12px 12px 20px 20px}.lamp__shade:after{content:"";position:absolute;left:31px;right:31px;bottom:2px;height:15px;border-radius:50%;background:#f6cf7e;box-shadow:0 0 52px 18px rgba(249,181,78,.7),0 0 92px 40px rgba(221,136,52,.24)}.lamp__switch{position:absolute;left:65px;top:190px;width:25px;height:33px;border-radius:8px;background:#1c130c;box-shadow:2px 3px 0 rgba(255,255,255,.08)}.lamp__switch:after{content:"";position:absolute;left:10px;top:23px;width:4px;height:36px;background:#ad8050;transform:rotate(-9deg)}.lamp__hint{position:absolute;left:13px;top:224px;color:rgba(228,204,165,.4);font:8px ui-monospace,monospace;letter-spacing:.13em;text-transform:uppercase}.prop{position:absolute;z-index:3;border:0;padding:0;background:none;cursor:pointer;touch-action:manipulation;transition:transform .25s,filter .25s}.prop:active{transform:scale(.96) rotate(var(--r,0deg))}.paper{left:8%;top:54%;width:116px;height:156px;transform:rotate(-11deg);background:linear-gradient(130deg,#e2d1b3,#bca88a);box-shadow:8px 12px 9px rgba(0,0,0,.42);clip-path:polygon(2% 0,100% 4%,96% 100%,0 96%)}.paper:before{content:"JUDAS\A 03:17\A\A NO MIRES\A LA CAJA\A ANTES DE\A RECORDAR";white-space:pre;position:absolute;inset:18px 11px;color:#4e2a21;font:11px/1.55 "Courier New",monospace;letter-spacing:.08em;transform:rotate(2deg)}.paper:after{content:"";position:absolute;width:54px;height:1px;left:26px;top:104px;background:#7e302b;transform:rotate(-12deg);box-shadow:8px 8px #7e302b,15px 16px #7e302b}.film{right:5%;top:53%;width:150px;height:56px;transform:rotate(12deg);background:#0f0c0b;box-shadow:5px 13px 8px rgba(0,0,0,.46);border-top:1px solid rgba(255,255,255,.2);border-bottom:1px solid rgba(255,255,255,.14)}.film:before{content:"";position:absolute;inset:9px 4px;background:linear-gradient(90deg,#512e24,#b38b61 24%,#281813 25%,#8a5640 49%,#22110d 50%,#a77b5b 74%,#321610 75%);opacity:.7}.film:after{content:"••••••••••••••••••••••";position:absolute;left:3px;top:18px;color:#d9bb87;font:10px/1 monospace;letter-spacing:2px}.coin{right:18%;top:67%;width:45px;height:45px;transform:rotate(-18deg);border-radius:50%;background:radial-gradient(circle at 38% 30%,#efd18a,#8c5b28 65%,#3c2415);border:3px solid #ab7f3e;box-shadow:5px 8px 7px rgba(0,0,0,.55)}.coin:after{content:"J";position:absolute;inset:7px;border:1px solid rgba(46,23,11,.6);border-radius:50%;display:grid;place-items:center;color:#4d2818;font:20px Georgia}.box{position:absolute;z-index:5;left:50%;top:50%;width:min(66vw,292px);aspect-ratio:1.3/1;transform:translate(-50%,-35%) rotate(-3deg);border:0;padding:0;background:linear-gradient(145deg,#3d2818,#160e09 70%);box-shadow:18px 28px 15px rgba(0,0,0,.55),inset 0 1px rgba(255,224,168,.18);cursor:pointer;touch-action:manipulation}.box:before{content:"";position:absolute;inset:9px;border:1px solid rgba(193,145,76,.5);box-shadow:inset 0 0 0 7px rgba(0,0,0,.18),inset 0 0 0 8px rgba(219,176,94,.15)}.box__top{position:absolute;inset:13px;transform:translateY(-13px) skewY(-2deg);background:linear-gradient(145deg,#5b3b23,#2b1b11 55%,#110a07);border:1px solid rgba(204,158,83,.45);box-shadow:0 -9px 13px rgba(0,0,0,.4)}.box__top:after{content:"JUDAS / 17";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:rgba(225,186,112,.56);font:10px ui-monospace,monospace;letter-spacing:.22em;white-space:nowrap}.box__glass{position:absolute;left:27%;top:22%;width:46%;height:48%;border:1px solid rgba(249,205,129,.65);background:radial-gradient(circle at 50% 50%,rgba(255,215,138,.45),rgba(130,73,25,.12) 38%,rgba(0,0,0,.22) 73%);box-shadow:inset 0 0 22px rgba(255,183,72,.24),0 0 25px rgba(221,148,58,.13);transition:background .5s,box-shadow .5s}.box__glass:after{content:"";position:absolute;left:50%;top:50%;width:20px;height:20px;border:1px solid rgba(255,236,178,.75);border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 15px rgba(255,211,121,.65)}.box__lock{position:absolute;left:50%;bottom:4px;width:31px;height:42px;transform:translateX(-50%);border:1px solid #ae7e3b;background:#24160d;box-shadow:0 3px 2px #0a0502}.box__lock:before{content:"";position:absolute;left:7px;top:-14px;width:15px;height:17px;border:3px solid #ae7e3b;border-bottom:0;border-radius:10px 10px 0 0}.box__lock:after{content:"";position:absolute;left:13px;top:14px;width:5px;height:11px;background:#d4a359;border-radius:5px}.box.is-open .box__top{transform:translateY(-75px) rotate(-8deg);opacity:.96;transition:transform .8s cubic-bezier(.16,1,.3,1)}.box.is-open .box__glass{background:radial-gradient(circle,#fff6cc 0,#ffd878 10%,rgba(255,170,58,.22) 43%,transparent 74%);box-shadow:0 0 42px rgba(255,209,112,.95),0 0 120px rgba(255,151,45,.36),inset 0 0 32px #fff1b4}.box.is-open .box__lock{opacity:0;transition:opacity .3s}.clue{position:absolute;z-index:6;opacity:0;pointer-events:none;left:50%;top:48%;width:128px;height:82px;transform:translate(-50%,-50%) rotate(5deg);padding:14px 12px;background:#ddd0b6;color:#40231c;box-shadow:7px 12px 12px rgba(0,0,0,.6);font:10px/1.45 "Courier New",monospace;transition:opacity .5s .6s,transform .8s .6s}.box.is-open+.clue{opacity:1;transform:translate(-50%,-155%) rotate(5deg);pointer-events:auto}.clue b{display:block;margin-bottom:5px;color:#8f1920;font-size:9px;letter-spacing:.14em}.dust{position:absolute;inset:0;z-index:7;pointer-events:none;opacity:.3;background-image:radial-gradient(circle,rgba(231,197,143,.7) 0 1px,transparent 1.5px);background-size:89px 113px;mix-blend-mode:screen}.caption{position:absolute;z-index:9;left:20px;right:20px;bottom:calc(18px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end;color:rgba(239,222,192,.58);font:9px/1.5 ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;pointer-events:none}.caption strong{display:block;color:#d4aa69;font-size:10px}.caption span:last-child{text-align:right}.inspect{position:absolute;z-index:12;left:14px;right:14px;bottom:calc(56px + env(safe-area-inset-bottom));padding:14px 16px;background:rgba(30,16,11,.94);border:1px solid rgba(210,164,92,.48);box-shadow:0 15px 40px rgba(0,0,0,.45);opacity:0;transform:translateY(15px);pointer-events:none;transition:opacity .25s,transform .25s}.inspect.is-visible{opacity:1;transform:none;pointer-events:auto}.inspect b{display:block;margin-bottom:5px;color:#d2a764;font:700 9px ui-monospace,monospace;letter-spacing:.18em}.inspect p{margin:0;color:#d7c6a9;font-size:15px;line-height:1.35}.inspect button{position:absolute;top:7px;right:10px;padding:3px 7px;border:0;background:none;color:#d2a764;font:16px monospace}.screen-flash{position:absolute;inset:0;z-index:11;pointer-events:none;background:#fff3c9;opacity:0}.screen-flash.is-flashing{animation:flash .8s ease-out}@keyframes flash{0%{opacity:0}18%{opacity:.42}100%{opacity:0}}@media(min-width:700px){.game{max-width:460px;margin:auto;box-shadow:0 0 80px rgba(0,0,0,.6)}.wall:before{opacity:.5}}
</style>
</head>
<body>
<main class="game" id="game">
  <div class="wall"></div><div class="horizon"></div><div class="desk"></div><div class="ambient"></div>
  <div class="lamp" aria-hidden="true"><i class="lamp__stem"></i><i class="lamp__shade"></i><i class="lamp__switch"></i><span class="lamp__hint">toca la luz</span></div>
  <button class="prop paper" data-inspect="paper" aria-label="Inspeccionar papel"></button>
  <button class="prop film" data-inspect="film" aria-label="Inspeccionar cinta"></button>
  <button class="prop coin" data-inspect="coin" aria-label="Inspeccionar moneda"></button>
  <button class="box" id="box" aria-label="Inspeccionar caja de luz"><span class="box__top"></span><span class="box__glass"></span><span class="box__lock"></span></button>
  <button class="clue" id="clue" aria-label="Leer nota de la caja"><b>NOTA ENCONTRADA</b>La luz no abre la caja.<br>La caja abre la luz.</button>
  <div class="dust"></div><div class="screen-flash" id="flash"></div>
  <div class="caption"><span><strong>BELENTANI / JUDAS</strong>01 — LA CAJA DE LUZ</span><span id="state">TRES OBJETOS / UNA HABITACIÓN</span></div>
  <aside class="inspect" id="inspect"><button id="closeInspect" aria-label="Cerrar">×</button><b id="inspectLabel">ARCHIVO</b><p id="inspectText"></p></aside>
  <audio id="track" preload="metadata" loop src="assets/judas-demo.mp3"></audio>
</main>
<script>
const game=document.querySelector('#game');const box=document.querySelector('#box');const clue=document.querySelector('#clue');const inspect=document.querySelector('#inspect');const inspectLabel=document.querySelector('#inspectLabel');const inspectText=document.querySelector('#inspectText');const state=document.querySelector('#state');const flash=document.querySelector('#flash');const track=document.querySelector('#track');let audioStarted=false;let found=new Set();let context;let panner;const text={paper:['PAPEL / 03:17','La tinta esta fresca. Alguien escribió esto después de cerrar la caja.'],film:['CINTA / FOTOGRAMA 07','La habitación aparece vacía. Solo se ve la luz encendida.'],coin:['MONEDA / CARA JUDAS','No es una moneda. Es una decisión que alguien dejó sobre la mesa.']};
function audio(){if(audioStarted)return;audioStarted=true;context=new AudioContext({latencyHint:'interactive'});panner=context.createPanner();panner.panningModel='HRTF';panner.distanceModel='inverse';panner.refDistance=1;panner.positionZ.value=1;const source=context.createMediaElementSource(track);source.connect(panner).connect(context.destination);track.volume=.28;track.play().catch(()=>{});}
function inspectObject(key){audio();found.add(key);inspectLabel.textContent=text[key][0];inspectText.textContent=text[key][1];inspect.classList.add('is-visible');if(found.size===3){state.textContent='LA HABITACIÓN TE HA VISTO';state.style.color='#d4aa69'}else state.textContent=`${found.size} / 3 OBJETOS OBSERVADOS`;}
function openBox(){audio();if(found.size<3){inspectLabel.textContent='LA CAJA';inspectText.textContent='La cerradura no responde. La habitación aún conserva tres cosas que no has mirado.';inspect.classList.add('is-visible');return}box.classList.add('is-open');flash.classList.add('is-flashing');state.textContent='DESBLOQUEADA / LA LUZ CAMBIA DE LUGAR';setTimeout(()=>flash.classList.remove('is-flashing'),850);}
document.querySelectorAll('[data-inspect]').forEach(item=>item.addEventListener('click',()=>inspectObject(item.dataset.inspect)));box.addEventListener('click',openBox);clue.addEventListener('click',()=>{inspectLabel.textContent='EL INTERIOR';inspectText.textContent='No hay una llave. Hay una dirección: mira donde la luz no llega.';inspect.classList.add('is-visible')});document.querySelector('#closeInspect').addEventListener('click',()=>inspect.classList.remove('is-visible'));document.querySelector('.lamp__switch').addEventListener('click',audio);game.addEventListener('pointermove',event=>{audio();if(!panner)return;const x=event.clientX/innerWidth-.5;panner.positionX.value=x*2;panner.positionY.value=(event.clientY/innerHeight-.5)*-.7});
</script>
</body>
</html>
