name: Audit

# Gate de higiene del repositorio. Deliberadamente simple y verde por
# construccion: comprueba lo que siempre debe ser cierto, sin toolchain,
# sin secrets y sin credenciales.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Higiene del repositorio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Ficheros obligatorios
        run: |
          faltan=0
          for f in README.md LICENSE SECURITY.md .gitignore; do
            if [ -e "$f" ]; then
              echo "ok   $f"
            else
              echo "FALTA $f"
              faltan=1
            fi
          done
          if [ "$faltan" -ne 0 ]; then
            echo "::error::El repositorio debe incluir README.md, LICENSE, SECURITY.md y .gitignore"
            exit 1
          fi

      - name: Sin secretos ni ficheros de entorno versionados
        run: |
          mal=0
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production)$'; then
            echo "::error::Hay ficheros .env versionados"
            mal=1
          fi
          if git grep -nIE "(ghp|gho|ghs|github_pat)_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{24,}|AIza[0-9A-Za-z_-]{30,}" -- ':!*.md' ':!*.lock' ':!pnpm-lock.yaml'; then
            echo "::error::Posible credencial en el codigo: revocalA antes de continuar"
            mal=1
          fi
          if [ "$mal" -eq 0 ]; then
            echo "ok   sin secretos detectados"
          fi
          exit $mal

      - name: Referencias locales de HTML
        run: node .github/scripts/check-html-refs.mjs

      - name: Resumen
        if: always()
        run: echo "Gate de higiene: estructura, secretos y referencias locales."
